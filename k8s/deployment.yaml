apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-lab
  namespace: lab
  labels:
    app: platform-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: platform-lab
  template:
    metadata:
      labels:
        app: platform-lab
    spec:
      containers:
        - name: app
          image: platform-lab:0.1.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-lab-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-lab-secret
                  key: API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
