apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-lab
  labels:
    app: platform-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: platform-lab
  template:
    metadata:
      labels:
        app: platform-lab
    spec:
      containers:
        - name: app
          image: platform-lab:0.1.0
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "0.1.0"
