apiVersion: v1
kind: Pod
metadata:
  name: broken-readiness
  namespace: lab
spec:
  containers:
    - name: app
      image: platform-lab:0.1.0
      readinessProbe:
        httpGet:
          path: /nao-existe
          port: 8000
        periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: broken-liveness
  namespace: lab
spec:
  containers:
    - name: app
      image: platform-lab:0.1.0
      livenessProbe:
        httpGet:
          path: /nao-existe
          port: 8000
        periodSeconds: 5
        failureThreshold: 2
