apiVersion: v1
kind: Pod
metadata:
  name: broken-oom
  namespace: lab
spec:
  containers:
    - name: app
      image: platform-lab:0.1.0
      command: ["python", "-c", "import time; x = bytearray(300 * 1024 * 1024); time.sleep(3600)"]
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi
